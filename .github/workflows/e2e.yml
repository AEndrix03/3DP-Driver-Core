name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware-driver:
    # Firmware reale (compilato per PC su scheda simulata) contro il core reale del driver.
    # Gira in entrambi i repository: una modifica al protocollo da un lato solo rompe la build.
    runs-on: ubuntu-latest
    steps:
      # Un ramo di lavoro che tocca il protocollo esiste con lo stesso nome in entrambi i
      # repository: si prova contro quello, altrimenti contro il ramo principale dell'altro.
      - name: Pick the matching branch of the other repository
        id: companion
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads "https://github.com/AEndrix03/3D-Printer-Firmware.git" "$branch" >/dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          repository: AEndrix03/3DP-Driver-Core
          path: 3DP-Driver-Core
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          repository: AEndrix03/3D-Printer-Firmware
          ref: ${{ steps.companion.outputs.ref }}
          path: 3D-Printer-Firmware
      - name: Run end-to-end tests
        run: bash 3DP-Driver-Core/tests/integration/run.sh 3D-Printer-Firmware
      # "3dp serve --sim": il servizio locale con dentro il firmware compilato per il PC
      - name: Build the local service with the simulated printer
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          bash 3DP-Driver-Core/tools/build_local.sh --sim
      - name: Simulated printer smoke test
        working-directory: 3DP-Driver-Core
        run: |
          ./build-local/3dp serve --sim --speed 4 --http 7444 &
          ok=""
          for i in $(seq 1 20); do
            if ./build-local/3dp status --http 7444 > status.json; then ok=1; break; fi
            sleep 1
          done
          cat status.json
          test -n "$ok"
          grep -q '"sim":{' status.json
          ./build-local/3dp home --http 7444
          kill %1

  driver-sources:
    # Compila ogni sorgente del driver con le dipendenze vere (Boost.Asio, librdkafka,
    # nlohmann-json, libcurl): copre porta seriale e connettori Kafka, che gli e2e non includono.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev librdkafka-dev nlohmann-json3-dev libcurl4-openssl-dev zlib1g-dev
      - name: Compile every source file
        run: |
          status=0
          for f in $(git ls-files 'src/*.cpp'); do
            g++ -std=c++17 -fsyntax-only -Iinclude "$f" || status=1
          done
          exit $status

  local-service:
    # "3dp": servizio locale con API, riga di comando e storico SQLite. Deve compilare con
    # il solo compilatore e SQLite, senza le dipendenze del driver completo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build
        run: bash tools/build_local.sh
      - name: Smoke test
        run: |
          ./build-local/3dp help
          # senza servizio attivo il client deve dirlo ed uscire con errore, non bloccarsi
          if ./build-local/3dp status; then exit 1; fi

