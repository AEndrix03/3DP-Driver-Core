# Profilo PrusaSlicer per la stampante 3DP (ugello 0.4 mm, filamento 1.75 mm, nessun piano
# riscaldato, un estrusore). Contiene solo le differenze rispetto ai valori di default:
#
#   prusa-slicer --export-gcode --load config/slicer/3dp-prusaslicer.ini -o out.gcode modello.stl
#
# I valori segnati "VERIFICARE" dipendono dalla meccanica reale e vanno confermati sulla macchina.

# ---------------------------------------------------------------- macchina
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 200
nozzle_diameter = 0.4
gcode_flavor = marlin
binary_gcode = 0
thumbnails =
remaining_times = 0
use_relative_e_distances = 0
use_firmware_retraction = 0
# Il firmware ha limiti propri (5000 mm/min, 1000 mm/s^2): qui servono solo alla stima dei tempi.
machine_limits_usage = time_estimate_only
machine_max_feedrate_x = 83
machine_max_feedrate_y = 83
machine_max_feedrate_z = 2.5
machine_max_feedrate_e = 25
machine_max_acceleration_x = 1000
machine_max_acceleration_y = 1000
machine_max_acceleration_z = 100
machine_max_acceleration_e = 1500
machine_max_acceleration_extruding = 1000
machine_max_acceleration_retracting = 1000
machine_max_acceleration_travel = 1000
# Archi veri (G2/G3) al posto di tanti segmenti corti: meno comandi sulla seriale e curve
# calcolate dal driver con tolleranza di 0,02 mm.
arc_fitting = emit_center
# VERIFICARE: 1 mm e' un valore da estrusore diretto; con tubo bowden servono 4-6 mm.
retract_length = 1
retract_speed = 35
retract_lift = 0.2

start_gcode = G28 ; azzera gli assi sui finecorsa\nG90\nM104 S[first_layer_temperature]\nG1 Z5 F600\nG1 X2 Y10 F4800\nM109 S[first_layer_temperature] ; attende la temperatura\nG92 E0\nG1 Z0.3 F600\nG1 X2 Y120 E9 F900 ; linea di spurgo sul bordo\nG1 X2.4 Y120 F4800\nG1 X2.4 Y30 E15 F900\nG92 E0\nG1 Z1 F600
end_gcode = G92 E0\nG1 E-2 F1800 ; ritrae\nG1 Z{min(max_layer_z + 5, max_print_height)} F600 ; si allontana dal pezzo\nG1 X5 Y200 F4800 ; presenta il pezzo\nM104 S0 ; spegne l'ugello\nM107 ; spegne la ventola

# ---------------------------------------------------------------- filamento (PLA)
filament_diameter = 1.75
filament_type = PLA
temperature = 205
first_layer_temperature = 210
bed_temperature = 0
first_layer_bed_temperature = 0
extrusion_multiplier = 1
# La ventola e' accesa o spenta (il pin non regola la velocita'): la si accende dal secondo strato.
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 0

# ---------------------------------------------------------------- stampa
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 20%
fill_pattern = gyroid
skirts = 1
skirt_distance = 4
# Senza piano riscaldato il primo strato va steso lento e largo.
first_layer_speed = 20
first_layer_extrusion_width = 0.5
perimeter_speed = 45
external_perimeter_speed = 30
small_perimeter_speed = 25
infill_speed = 60
solid_infill_speed = 50
top_solid_infill_speed = 30
support_material_speed = 45
bridge_speed = 30
gap_fill_speed = 25
# Sotto il limite del firmware (83 mm/s).
travel_speed = 80
travel_speed_z = 2.5
default_acceleration = 0
gcode_comments = 0
gcode_label_objects = disabled
